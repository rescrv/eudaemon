[package]
name = "agentkb"
version = "0.1.0"
edition = "2024"

[dependencies]
markdown = "1.0.0"
rustyline = { version = "15", features = ["with-file-history"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8"

[dev-dependencies]
claudius = "0.16.0"
