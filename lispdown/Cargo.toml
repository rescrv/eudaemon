[package]
name = "agentkb"
version = "0.1.0"
edition = "2024"

[dependencies]
arrrg = "0.8.0"
arrrg_derive = "0.8.0"
async-trait = "0.1.89"
claudius = { path = "../../claudius", version = "0.16.0" } 
getopts = "0.2.24"
markdown = "1.0.0"
rustyline = { version = "15", features = ["with-file-history"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
sha3 = "0.10"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8"
utf8path = "0.9.1"

[[example]]
name = "lincoln"
path = "examples/lincoln.rs"
