[metadata]
version = "1.0"
description = "Expected error tests: operations that should fail"

# =============================================================================
# prune errors
# =============================================================================

[[test]]
name = "prune_root_fails"
description = "Cannot prune the root document"
before_sexpr = '(doc (h1 "Title"))'
mutation = { op = "prune", path = "root" }
expected_error = { code = "cannot-prune-root" }

[[test]]
name = "prune_index_out_of_bounds"
description = "Pruning non-existent index fails"
before_sexpr = '(doc (h1 "Title"))'
mutation = { op = "prune", path = "99" }
expected_error = { code = "index-out-of-bounds" }

[[test]]
name = "prune_nested_out_of_bounds"
description = "Pruning non-existent nested index fails"
before_sexpr = '(doc (ul (li (p "A"))))'
mutation = { op = "prune", path = "1.99" }
expected_error = { code = "index-out-of-bounds" }

[[test]]
name = "prune_descend_into_atom"
description = "Cannot descend into an atom"
before_sexpr = '(doc (h1 "Title"))'
mutation = { op = "prune", path = "1.1.1" }
expected_error = { code = "cannot-descend-atom" }

