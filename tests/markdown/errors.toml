# =============================================================================
# hoist errors
# =============================================================================

[[test]]
name = "hoist_non_heading"
description = "Cannot hoist a non-heading element"
before_sexpr = '(doc (p "Not a heading"))'
mutation = { op = "hoist", path = "1", delta = 1 }
expected_error = { code = "not-a-heading" }

[[test]]
name = "hoist_node_not_found"
description = "Cannot hoist non-existent node"
before_sexpr = '(doc (h1 "Title"))'
mutation = { op = "hoist", path = "99", delta = 1 }
expected_error = { code = "node-not-found" }

[[test]]
name = "hoist_blockquote_fails"
description = "Cannot hoist a blockquote"
before_sexpr = '(doc (blockquote (p "Quote")))'
mutation = { op = "hoist", path = "1", delta = 1 }
expected_error = { code = "not-a-heading" }

[[test]]
name = "hoist_list_fails"
description = "Cannot hoist a list"
before_sexpr = '(doc (ul (li (p "Item"))))'
mutation = { op = "hoist", path = "1", delta = 1 }
expected_error = { code = "not-a-heading" }

# =============================================================================
# graft errors
# =============================================================================

[[test]]
name = "graft_source_not_found"
description = "Cannot graft from non-existent source"
before_sexpr = '(doc (h1 "Title"))'
mutation = { op = "graft", source = "99", target_parent = "root", target_index = 1 }
expected_error = { code = "source-not-found" }

[[test]]
name = "graft_source_nested_not_found"
description = "Cannot graft from non-existent nested source"
before_sexpr = '(doc (ul (li (p "A"))))'
mutation = { op = "graft", source = "1.99", target_parent = "root", target_index = 1 }
expected_error = { code = "source-not-found" }

# =============================================================================
# Unknown operation
# =============================================================================

[[test]]
name = "unknown_operation"
description = "Unknown mutation operation fails"
before_sexpr = '(doc (h1 "Title"))'
mutation = { op = "unknown_op", path = "1" }
expected_error = { message_contains = "Unknown mutation operation" }
